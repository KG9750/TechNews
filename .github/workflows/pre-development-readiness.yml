name: Pre-development readiness

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  readiness:
    name: Validate readiness artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate local readiness artifacts
        run: python scripts/check_readiness.py

      - name: Compile readiness scripts
        run: |
          python -m py_compile \
            scripts/check_readiness.py \
            scripts/spikes/archive_storage_spike.py \
            scripts/spikes/feishu_delivery_spike.py \
            scripts/spikes/model_provider_spike.py \
            scripts/spikes/readiness_manifest.py \
            scripts/spikes/live_readiness_preflight.py \
            scripts/test_live_evidence_helpers.py \
            scripts/source_owner_review_decision.py \
            scripts/test_source_owner_review_decision.py

      - name: Test live evidence helpers
        run: python scripts/test_live_evidence_helpers.py

      - name: Test source owner review decision helper
        run: python scripts/test_source_owner_review_decision.py

      - name: Verify evidence templates cannot pass as live evidence
        run: |
          set +e
          python scripts/check_readiness.py --require-evidence --evidence-root fixtures/live-evidence-templates
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then
            echo "Expected template evidence validation to fail with exit code 1, got $status"
            exit 1
          fi

      - name: Verify leaky evidence cannot pass as live evidence
        run: |
          set +e
          python scripts/check_readiness.py --require-evidence --evidence-root fixtures/live-evidence-negative/leaky-feishu
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then
            echo "Expected leaky evidence validation to fail with exit code 1, got $status"
            exit 1
          fi
