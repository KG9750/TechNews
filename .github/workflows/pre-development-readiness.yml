name: Pre-development readiness

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  readiness:
    name: Validate readiness artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate local readiness artifacts
        run: python scripts/check_readiness.py

      - name: Compile readiness scripts
        run: |
          python -m py_compile \
            scripts/check_readiness.py \
            scripts/spikes/archive_storage_spike.py \
            scripts/spikes/feishu_delivery_spike.py \
            scripts/spikes/model_provider_spike.py \
            scripts/spikes/readiness_manifest.py \
            scripts/spikes/live_readiness_preflight.py \
            scripts/test_live_evidence_helpers.py \
            scripts/readiness_action_packet.py \
            scripts/test_readiness_action_packet.py \
            scripts/source_owner_review_decision.py \
            scripts/test_source_owner_review_decision.py \
            scripts/test_product_modules.py \
            scripts/run_tests.py \
            scripts/generate_architecture_review_ui.py \
            technews_briefing/__init__.py \
            technews_briefing/contracts.py \
            technews_briefing/source_policy.py \
            technews_briefing/run.py

      - name: Run local test entrypoint
        run: python scripts/run_tests.py

      - name: Verify evidence templates cannot pass as live evidence
        run: |
          set +e
          python scripts/check_readiness.py --require-evidence --evidence-root fixtures/live-evidence-templates
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then
            echo "Expected template evidence validation to fail with exit code 1, got $status"
            exit 1
          fi

      - name: Verify leaky evidence cannot pass as live evidence
        run: |
          for root in \
            fixtures/live-evidence-negative/leaky-feishu \
            fixtures/live-evidence-negative/leaky-model-provider \
            fixtures/live-evidence-negative/leaky-archive-storage
          do
            set +e
            python scripts/check_readiness.py --require-evidence --evidence-root "$root"
            status=$?
            set -e
            if [ "$status" -ne 1 ]; then
              echo "Expected leaky evidence validation to fail with exit code 1 for $root, got $status"
              exit 1
            fi
          done
